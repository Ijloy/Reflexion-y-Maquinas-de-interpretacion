spring.application.name=demo
server.port=8080

logging.level.com.udla.arquitectura.demo=INFO

# --- Figuras dinamicas (reflexion + Groovy) ---
# Catalogo externo de codigo Groovy (extra). Contrato: GET {url}/{nombre} -> text/plain con el codigo.
# Por defecto apunta al simulador incluido en esta misma app (CatalogoExternoController);
# para usar un servicio real basta con cambiar esta URL.
figuras.catalogo.url=http://localhost:${local.server.port:${server.port}}/catalogo-externo
# Si se pide una figura desconocida, intentar traerla del catalogo externo automaticamente
figuras.catalogo.importar-automaticamente=true
